version: "3.8"

services:
    authenticator:
        build:
            context: ./Auth
            dockerfile: Dockerfile
        container_name: authenticator
        ports:
            - "6000:6000"
        environment:
            - SERVICE_ENV=development

    backend:
        build:
            context: ./Backend
            dockerfile: Dockerfile
        container_name: backend
        ports:
            - "5000:5000"
        environment:
            - SERVICE_ENV=development
        depends_on:
            - yugabytedb

    frontend:
        build:
            context: ./Frontend
            dockerfile: Dockerfile
        container_name: frontend
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=development

    yugabytedb:
        image: yugabytedb/yugabyte
        container_name: yugabyte
        ports:
            - "7000:7000"     # Admin UI
            - "9000:9000"     # Master Admin UI
            - "15433:15433"   # YSQL Web UI
            - "5433:5433"     # YSQL
        environment:
            YSQL_USER: yugabyte
            YSQL_PASSWORD: yugabyte
        volumes:
            - yugabyte_data:/home/yugabyte/yb_data    
        command: >
            bin/yugabyted start
            --base_dir=/home/yugabyte/yb_data
            --background=false
    mongo:
        image: mongo:8
        container_name: mongodb
        ports:
            - "27017:27017"
        environment:
            - MONGO_INITDB_ROOT_USERNAME=root
            - MONGO_INITDB_ROOT_PASSWORD=12345678
            - MONGO_INITDB_DATABASE=cugrader
        volumes:
          - mongo_data:/data/db
          - ./mongo/init-mongo.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

volumes:
  yugabyte_data:
  mongo_data: