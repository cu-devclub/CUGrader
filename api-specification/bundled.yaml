openapi: 3.0.0
servers:
  - url: 'https://authcugrader.sittha.net/v1'
  - url: 'https://apicugrader.sittha.net/v1'
info:
  version: 1.0.0
  title: CUGrader API server
paths:
  /ping:
    get:
      operationId: testPing
      tags:
        - system
      responses:
        '200':
          description: Pong response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
        '418':
          $ref: '#/components/responses/ErrPurrmissionDecline'
  '/picture/{PictureId}':
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    summary: get
    get:
      operationId: getUserAndClassPicture
      tags:
        - user
      summary: getting image with picture id
      parameters:
        - name: PictureId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PictureId'
      responses:
        '200':
          description: image file
          content:
            application/json:
              schema:
                type: object
                required:
                  - content
                properties:
                  content:
                    type: string
                    description: The image file in base64 format or a link to the image so you can use directly to <img>
                    example: 'https://media.cnn.com/api/v1/images/stellar/prod/130604125005-rick-astley-video.jpg?q=x_0,y_152,h_720,w_1280,c_crop/h_653,w_1160/f_avif'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  /login:
    servers:
      - url: 'https://authcugrader.sittha.net/v1'
    summary: redirect to google OAuth2
    get:
      operationId: redirectUserToAuthenticationSystem
      tags:
        - user
      responses:
        '307':
          description: redirect to google OAuth2
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  /callback:
    summary: handle callback from google
    get:
      servers:
        - url: 'https://authcugrader.sittha.net/v1'
      responses:
        '307':
          description: redirect back to frotnend
        '500':
          $ref: '#/components/responses/ErrServerIssue'
    post:
      operationId: getUserDataFromGoogle
      tags:
        - user
      servers:
        - url: 'https://apicugrader.sittha.net/v1'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - credential
              properties:
                key:
                  type: string
                  description: key for decrypt data
                credential:
                  type: string
                  description: encrypted data
      responses:
        '200':
          description: response access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access-token:
                    $ref: '#/components/schemas/WithJWT'
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  /testcallback:
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    summary: for getting JWT Token custom email for testing
    post:
      operationId: userForCreateTestUser
      tags:
        - user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
              properties:
                key:
                  type: string
                  description: unused
                credential:
                  type: string
                  description: email end with @chula.ac.th or @student chula.ac.th
      responses:
        '200':
          description: response access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access-token:
                    $ref: '#/components/schemas/WithJWT'
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  /classes/semesters:
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    summary: List of year-semester
    get:
      operationId: getSemesterOfUser
      tags:
        - class
      responses:
        '200':
          description: List year-semester
          content:
            application/json:
              schema:
                properties:
                  semesters:
                    type: array
                    items:
                      type: string
                      description: year-semester
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '403':
          $ref: '#/components/responses/ErrPermissionDecline'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  '/classes/classes/{year-semester}':
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    summary: List of class in year-semester
    get:
      operationId: getClasses
      tags:
        - class
      parameters:
        - name: year-semester
          description: The unique identifier of the class
          in: path
          required: true
          schema:
            type: string
            description: year-semester
      responses:
        '200':
          description: List of class object
          content:
            application/json:
              schema:
                properties:
                  assistant:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClassObject'
                  study:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClassObject'
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  /class:
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    post:
      operationId: createClass
      tags:
        - class
      summary: Create class
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - course_id
                - name
                - semester
              properties:
                course_id:
                  description: course id according to reg cu
                  type: integer
                name:
                  description: Name of class
                  type: string
                semester:
                  description: Semester of class
                  type: string
                image:
                  description: Class image file
                  type: string
                  format: binary
                students:
                  description: Student csv file
                  type: string
                  format: binary
      responses:
        '200':
          description: Empty JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '403':
          $ref: '#/components/responses/ErrPermissionDecline'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
    patch:
      operationId: editClass
      tags:
        - class
      summary: partially edit class information
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - ClssId
                - course_id
                - name
                - semester
              properties:
                ClassId:
                  $ref: '#/components/schemas/ClassId'
                course_id:
                  description: course id according to reg cu
                  type: integer
                name:
                  description: Name of class
                  type: string
                semester:
                  description: Semester of class
                  type: string
                image:
                  description: Class image file
                  type: string
                  format: binary
                students:
                  description: Student csv file
                  type: string
                  format: binary
      responses:
        '200':
          description: Empty JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '403':
          $ref: '#/components/responses/ErrPermissionDecline'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  '/class/{ClassId}':
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    get:
      operationId: getClassInformation
      tags:
        - class
      parameters:
        - name: ClassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ClassId'
      responses:
        '200':
          description: get specific class info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassObject'
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '403':
          $ref: '#/components/responses/ErrPermissionDecline'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  '/sections/{ClassId}':
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    get:
      operationId: getSectionInClass
      tags:
        - class
      parameters:
        - name: ClassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ClassId'
      responses:
        '200':
          description: assistants array and instructor array
          content:
            application/json:
              schema:
                type: object
                required:
                  - sections
                properties:
                  sections:
                    type: array
                    items:
                      type: integer
                      description: section number
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '403':
          $ref: '#/components/responses/ErrPermissionDecline'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  '/groups/{ClassId}':
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    get:
      operationId: getGroupsInClass
      tags:
        - class
      parameters:
        - name: ClassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ClassId'
      responses:
        '200':
          description: assistants array and instructor array
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: string
                      description: group name
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '403':
          $ref: '#/components/responses/ErrPermissionDecline'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  /students:
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    post:
      operationId: insertStudentToClass
      tags:
        - student
      summary: Insert student
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ClassId:
                  $ref: '#/components/schemas/ClassId'
                email:
                  description: student's email
                  type: string
                section:
                  description: section of student
                  type: integer
                group:
                  description: group of student
                  type: string
              required:
                - ClassId
                - email
                - section
      responses:
        '200':
          description: Empty JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
    delete:
      operationId: deleteStudentFromClass
      tags:
        - student
      summary: Delete student
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ClassId:
                  $ref: '#/components/schemas/ClassId'
                StudentId:
                  description: student id primary key
                  type: string
              required:
                - ClassId
                - StudentId
      responses:
        '200':
          description: Empty JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
    patch:
      operationId: editStudentInClass
      tags:
        - student
      summary: Edit student info
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ClassId:
                  $ref: '#/components/schemas/ClassId'
                StudentId:
                  description: student id primary key
                  type: string
                section:
                  description: section of student
                  type: integer
                group:
                  description: group of student
                  type: string
                withdrawal:
                  description: is student withdrawn
                  type: boolean
              required:
                - ClassId
                - StudentId
      responses:
        '200':
          description: Empty JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '403':
          $ref: '#/components/responses/ErrPermissionDecline'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  '/students/{ClassId}':
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    get:
      operationId: getStudentsIncClass
      tags:
        - student
      summary: list student by class
      parameters:
        - name: ClassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ClassId'
      responses:
        '200':
          description: Array of students
          content:
            application/json:
              schema:
                type: object
                required:
                  - students
                properties:
                  students:
                    description: List of student
                    type: array
                    items:
                      type: object
                      properties:
                        StudentId:
                          type: string
                        name:
                          type: string
                        section:
                          type: integer
                        group:
                          type: string
                        picture:
                          description: url
                          type: string
                        score:
                          type: number
                        max_score:
                          type: number
                        withdrawal:
                          type: boolean
                      required:
                        - StudentId
                        - name
                        - section
                        - group
                        - picture
                        - score
                        - max_score
                        - withdrawal
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '403':
          $ref: '#/components/responses/ErrPermissionDecline'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  /TA:
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    post:
      operationId: insertAssistantToClass
      tags:
        - assistant
      summary: Add TA to class
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TAEditBody'
      responses:
        '200':
          description: Empty JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
    delete:
      operationId: deleteAssistantFromClass
      tags:
        - assistant
      summary: Delete TA from class
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TAEditBody'
      responses:
        '200':
          description: Empty JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '403':
          $ref: '#/components/responses/ErrPermissionDecline'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  '/TA/{ClassId}':
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    get:
      operationId: getAssistantsInClass
      tags:
        - assistant
      summary: list ta and instructor by class
      parameters:
        - name: ClassId
          description: The unique identifier of the class
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ClassId'
      responses:
        '200':
          description: assistants array and instructor array
          content:
            application/json:
              schema:
                type: object
                properties:
                  assistant:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        picture:
                          description: url
                          type: string
                        leader:
                          type: boolean
                        email:
                          type: string
                      required:
                        - name
                        - picture
                        - leader
                        - email
                  instructor:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        picture:
                          description: url
                          type: string
                        email:
                          type: string
                      required:
                        - name
                        - picture
                        - email
                required:
                  - assistant
                  - instructor
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '403':
          $ref: '#/components/responses/ErrPermissionDecline'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  /near_due_date:
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    summary: get nearly unsubmit due date lab
    get:
      operationId: getNearDueDateLabs
      tags:
        - lab
      responses:
        '200':
          description: json of labs array
          content:
            application/json:
              schema:
                type: object
                properties:
                  labs:
                    description: array of labs
                    type: array
                    items:
                      type: object
                      properties:
                        course_id:
                          type: integer
                        course_name:
                          type: string
                        LabId:
                          $ref: '#/components/schemas/LabId'
                        lab_name:
                          type: string
                        lab_due:
                          type: string
                          description: date time
                        lab_max_score:
                          type: integer
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  /lab:
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    post:
      operationId: createLab
      tags:
        - lab
      summary: create lab
      requestBody:
        description: required all
        content:
          multipart/form-data:
            schema:
              properties:
                ClassId:
                  $ref: '#/components/schemas/ClassId'
                lab_data:
                  $ref: '#/components/schemas/labEdit'
      responses:
        '200':
          description: Empty JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
    patch:
      operationId: updateLab
      tags:
        - lab
      summary: edit lab
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                LabId:
                  $ref: '#/components/schemas/LabId'
                lab_data:
                  $ref: '#/components/schemas/labEdit'
      responses:
        '200':
          description: Empty JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '403':
          $ref: '#/components/responses/ErrPermissionDecline'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  '/labs/{ClassId}':
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    get:
      operationId: getLabsInClass
      tags:
        - lab
      parameters:
        - name: ClassId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ClassId'
      responses:
        '200':
          description: list lab in class
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    LabId:
                      $ref: '#/components/schemas/LabId'
                    lab_number:
                      type: integer
                    lab_name:
                      type: string
                    publish:
                      type: string
                      description: datetime
                    due:
                      type: string
                      description: datetime
                    score:
                      type: integer
                    max_score:
                      type: integer
                    status:
                      type: string
                      enum:
                        - new
                        - partial_complete
                        - complete
                        - late
                        - due_soon
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '403':
          $ref: '#/components/responses/ErrPermissionDecline'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrServerIssue'
  '/lab/{LabId}':
    parameters:
      - in: header
        name: Authentication
        schema:
          $ref: '#/components/schemas/WithJWT'
    servers:
      - url: 'https://apicugrader.sittha.net/v1'
    get:
      operationId: getLabInformation
      tags:
        - lab
      summary: lab detail
      parameters:
        - name: LabId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LabId'
      responses:
        '200':
          description: lab detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  addfiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddFileId'
                  question_ids:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuestionId'
                  number:
                    type: number
                    description: lab number
                  name:
                    type: string
                    description: lab name
                  publish:
                    description: datetime format
                    type: string
                  due:
                    description: datetime format
                    type: string
                  language:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: language name
                        id:
                          $ref: '#/components/schemas/LanguageId'
                  exam_mode:
                    type: boolean
                  close_on_due:
                    type: boolean
                  assign_to:
                    type: array
                    items:
                      type: string
                      description: group name
                  testcase:
                    type: integer
