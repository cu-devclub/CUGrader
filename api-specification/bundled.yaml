components:
  schemas:
    Pong:
      type: object
      required:
        - ping
      properties:
        ping:
          type: string
          example: pong
    LabId:
      description: 'A unique identifier for a lab, typically used to retrieve or reference a specific lab in a system.'
      type: integer
      example: 1
    QuestionId:
      description: 'A unique identifier for a question, typically used to retrieve or reference a specific question in a system.'
      type: integer
      example: 1
    AddFileId:
      description: 'A unique identifier for a additional file, typically used to retrieve or reference a specific additional file in a system.'
      type: integer
      example: 1
    SubmissionId:
      description: 'A unique identifier for a submission, typically used to retrieve or reference a specific submission in a system.'
      type: integer
      example: 1
    TestCaseId:
      description: 'A unique identifier for a testcase, typically used to retrieve or reference a specific testcase in a system.'
      type: integer
      example: 1
    PictureId:
      description: 'A unique identifier for a picture, typically used to retrieve or reference an image in a system.'
      type: integer
      example: 12345
    ClassId:
      description: 'A unique identifier for a class, typically used to retrieve or reference a specific class in a system.'
      type: integer
      example: 1
    LanguageId:
      description: 'A unique identifier for a language, typically used to retrieve or reference an language in a system.'
      type: integer
      example: 12345
    WithJWT:
      type: string
      description: JWT token for authentication
      example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTUxNjIzOTAyMn0.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30
    ClassObject:
      type: object
      properties:
        ClassId:
          $ref: '#/components/schemas/ClassId'
        course_id:
          description: id of corse from reg
          type: string
          example: 2301102
        course_name:
          type: string
          example: การเขียนโปรแกรมเชิงวัตถุ
        PictureId:
          $ref: '#/components/schemas/PictureId'
      required:
        - ClassId
        - course_id
        - course_name
        - PictureId
    TAEditBody:
      type: object
      properties:
        ClassId:
          $ref: '#/components/schemas/ClassId'
        email:
          description: TA's email
          type: string
      required:
        - ClassId
        - email
    labEdit:
      type: object
      properties:
        number:
          type: integer
        name:
          type: string
        publish:
          type: string
          description: datetime
        due:
          type: string
          description: datetime
        language_ids:
          type: array
          items:
            type: integer
        close_on_due:
          type: boolean
        exam_mode:
          type: boolean
        show_score_on_lock:
          type: boolean
        assign_to:
          type: array
          items:
            type: string
            description: group name
        exam_pin:
          type: integer
        testcase:
          type: string
        secret_testcase:
          type: string
        questions:
          type: array
          items:
            type: object
            properties:
              number:
                type: integer
              name:
                type: string
              description:
                type: string
              answer:
                type: string
              predefine:
                type: string
              score:
                type: integer
              testcase:
                type: string
              secret_testcase:
                type: string
              multilang_testcase:
                type: array
                items:
                  type: object
                  properties:
                    input:
                      type: string
                    output:
                      type: string
              multilang_secret_testcase:
                type: array
                items:
                  type: object
                  properties:
                    input:
                      type: string
                    output:
                      type: string
        addfiles:
          type: array
          items:
            type: string
            format: binary
          description: Multiple additional files
  responses:
    ErrServerIssue:
      description: Server ran into an error while processing the request
      content:
        application/json:
          schema:
            required:
              - human_message
              - debug_message
            properties:
              human_message:
                type: string
                description: A message for the user to understand the error
              debug_message:
                type: string
                description: A message for developers to understand the error
    ErrNotFound:
      description: Server cannot find the requested resource
      content:
        application/json:
          schema:
            required:
              - human_message
            properties:
              human_message:
                type: string
                description: A message for the user to understand the error
                example: The requested resource was not found
    ErrBadRequest:
      description: Server cannot process with the request due to a client error
      content:
        application/json:
          schema:
            required:
              - human_message
            properties:
              human_message:
                type: string
                description: A message for the user to understand the error
                example: The request was invalid or cannot be served. The request should not be repeated without modification.
    ErrPermissionDecline:
      description: Server rejected the request due to insufficient permissions
      content:
        application/json:
          schema:
            required:
              - human_message
            properties:
              human_message:
                type: string
                description: A message for the user to understand the error
                example: Permission denied. You do not have the required permissions to access this resource.
    ErrPurrmissionDecline:
      description: Server rejected the request due to insufficient purrmissions
      content:
        application/json:
          schema:
            required:
              - cat_message
            properties:
              human_message:
                type: string
                description: A message for the cat to understand the error
                example: Meeeeoowww! WRAAAWWRRR!
    ErrUnauthorized:
      description: Server rejected the request due to insufficient authorization
      content:
        application/json:
          schema:
            required:
              - human_message
            properties:
              human_message:
                type: string
                description: A message for the user to understand the error
                example: Unauthorized access. Please provide valid credentials to access this resource.
tags:
  - name: assistant
    description: assistant operations
  - name: class
    description: class operations
  - name: lab
    description: lab operations
  - name: student
    description: student operations
  - name: submission
    description: submission operations
  - name: system
    description: system operations
  - name: user
    description: user operations
