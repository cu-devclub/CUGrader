parameters:
  - in: header
    name: Authentication
    schema:
      $ref: "../components/schemas/WithJWT.yaml"
servers:
  - url: https://apicugrader.sittha.net/v1
get:
  operationId: getSubmissionResultBySubmissionId
  parameters:
    - name: SubmissionId
      in: path
      required: true
      schema:
        $ref: "../components/schemas/SubmissionId.yaml"
  responses:
    "200":
      description: return result array
      content:
        application/json:
          schema:
            type: object
            properties:
              normal:
                type: array
                items:
                  type: object
                  properties:
                    input:
                      type: string
                    output:
                      type: string
                      description: expected result (nil in somecase)
                    message:
                      type: string
                      description: message result
                    status:
                      type: string
                      enum:
                        - "fail"
                        - "pass"
                        - "pending"
              secret:
                type: array
                items:
                  type: object
                  properties:
                    message:
                      type: string
                      description: message result
                    status:
                      type: string
                      enum:
                        - "fail"
                        - "pass"
                        - "pending"
    "500":
      $ref: "../components/responses/ErrServerIssue.yaml"
    "400":
      $ref: "../components/responses/ErrBadRequest.yaml"
    "401":
      $ref: "../components/responses/ErrUnauthorized.yaml"
    "403":
      $ref: "../components/responses/ErrPermissionDecline.yaml"
    "404":
      $ref: "../components/responses/ErrNotFound.yaml"
