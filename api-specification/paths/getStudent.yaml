parameters:
  - in: header
    name: Authentication
    schema:
      $ref: "../components/schemas/WithJWT.yaml"
servers:
  - url: https://apicugrader.sittha.net/v1
get:
  summary: "list student by class"
  parameters:
    - name: ClassId
      in: path
      required: true
      schema:
        $ref: "../components/schemas/ClassId.yaml"
  responses:
    "200":
      description: Array of students
      content:
        application/json:
          schema:
            type: object
            required:
              - "students"
            properties:
              students:
                description: List of student
                type: array
                items:
                  type: object
                  properties:
                    StudentId:
                      type: string
                    name:
                      type: string
                    section:
                      type: integer
                    group:
                      type: string
                    picture:
                      description: url
                      type: string
                    score:
                      type: number
                    max_score:
                      type: number
                    withdrawal:
                      type: boolean
                  required:
                    - "StudentId"
                    - "name"
                    - "section"
                    - "group"
                    - "picture"
                    - "score"
                    - "max_score"
                    - "withdrawal"
    "500":
      $ref: '../components/responses/ErrServerIssue.yaml'
    "400":
      $ref: '../components/responses/ErrBadRequest.yaml'
    "401":
      $ref: '../components/responses/ErrUnauthorized.yaml'
    "403":
      $ref: '../components/responses/ErrPermissionDecline.yaml'
    "404":
      $ref: '../components/responses/ErrNotFound.yaml'