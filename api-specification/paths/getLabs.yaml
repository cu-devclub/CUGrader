parameters:
  - in: header
    name: Authentication
    schema:
      $ref: "../components/schemas/WithJWT.yaml"
servers:
  - url: https://apicugrader.sittha.net/v1
get:
  parameters:
    - name: ClassId
      in: path
      required: true
      schema:
        $ref: "../components/schemas/ClassId.yaml"
  responses:
    "200":
      description: list lab in class
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                LabId:
                  $ref: "../components/schemas/LabId.yaml"
                lab_number:
                  type: integer
                lab_name:
                  type: string
                publish:
                  type: string
                  description: datetime
                due:
                  type: string
                  description: datetime
                score:
                  type: integer
                max_score:
                  type: integer
                status:
                  type: string
                  enum:
                    - "new"
                    - "partial_complete"
                    - "complete"
                    - "late"
                    - "due_soon"
    "500":
      $ref: '../components/responses/ErrServerIssue.yaml'
    "400":
      $ref: '../components/responses/ErrBadRequest.yaml'
    "401":
      $ref: '../components/responses/ErrUnauthorized.yaml'
    "403":
      $ref: '../components/responses/ErrPermissionDecline.yaml'
    "404":
      $ref: '../components/responses/ErrNotFound.yaml'